---
version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - forbidigo
    - goconst
    - gocyclo
    - gocritic
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^cobra\.Command\.(Print|Println|Printf|OutOrStderr)$
          msg: >-
            writes through OutOrStderr, which SetOut binds to stdout (spf13/cobra#1708);
            write to f.IOStreams.ErrOut or cmd.ErrOrStderr()
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - lll
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    goimports:
      local-prefixes:
        - github.com/KubeRocketCI/cli
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
