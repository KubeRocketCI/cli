---
version: "2"
run:
  allow-parallel-runners: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
linters:
  default: none
  enable:
    - depguard
    - dupl
    - errcheck
    - forbidigo
    - goconst
    - gocyclo
    - gocritic
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    depguard:
      rules:
        portal:
          list-mode: lax
          files:
            - ${base-path}/internal/portal/**
          deny:
            - pkg: github.com/KubeRocketCI/cli/internal/iostreams
              desc: internal/portal returns results; rendering stays in the command layer
            - pkg: github.com/KubeRocketCI/cli/internal/output
              desc: internal/portal returns results; rendering stays in the command layer
        output:
          list-mode: lax
          files:
            - ${base-path}/internal/output/**
          deny:
            - pkg: github.com/KubeRocketCI/cli/internal/portal
              desc: internal/output renders generic values; portal-specific renderers live under pkg/cmd
            - pkg: github.com/KubeRocketCI/cli/internal/iostreams
              desc: internal/output primitives take an io.Writer; the -o contract lives in pkg/cmd/internal/render
            - pkg: github.com/KubeRocketCI/cli/internal/cmdutil
              desc: internal/output primitives take an io.Writer; the -o contract lives in pkg/cmd/internal/render
        cmdutil:
          list-mode: lax
          files:
            - ${base-path}/internal/cmdutil/**
          deny:
            - pkg: github.com/KubeRocketCI/cli/internal/output
              desc: the Factory does not render; output goes through pkg/cmd/internal/render
        render:
          list-mode: lax
          files:
            - ${base-path}/pkg/cmd/internal/render/**
          deny:
            - pkg: github.com/KubeRocketCI/cli/internal/cmdutil
              desc: the output contract does not depend on the Factory module
        colorprofile:
          list-mode: lax
          files:
            - $all
            - "!${base-path}/internal/iostreams/**"
          deny:
            - pkg: github.com/charmbracelet/colorprofile
              desc: the colour profile is applied once per process stream in internal/iostreams
        viper:
          list-mode: lax
          files:
            - $all
            - "!${base-path}/internal/config/**"
          deny:
            - pkg: github.com/spf13/viper
              desc: configuration is read only through internal/config
        cobra:
          list-mode: lax
          files:
            - $all
            - "!${base-path}/pkg/cmd/**"
            - "!${base-path}/internal/cmdutil/**"
            - "!${base-path}/cmd/krci/*_test.go"
          deny:
            - pkg: github.com/spf13/cobra
              desc: cobra is imported only by pkg/cmd and internal/cmdutil
        # The restapi and config rules and the Factory field exclusions in forbidigo share the exempt
        # paths (factory.go, cmdtest, root.go, login.go, tests); edit them together.
        restapi:
          list-mode: lax
          files:
            - $all
            - "!$test"
            - "!${base-path}/internal/portal/**"
            - "!${base-path}/internal/cmdutil/factory.go"
            - "!${base-path}/pkg/cmd/internal/cmdtest/**"
          deny:
            - pkg: github.com/KubeRocketCI/cli/internal/portal/restapi
              desc: the generated client is imported only by internal/portal, the Factory, cmdtest and tests; commands get portal services from Factory.Services
        config:
          list-mode: lax
          files:
            - ${base-path}/pkg/cmd/**
            - "!$test"
            - "!${base-path}/pkg/cmd/root/root.go"
            - "!${base-path}/pkg/cmd/auth/login/login.go"
            - "!${base-path}/pkg/cmd/internal/cmdtest/**"
          deny:
            - pkg: github.com/KubeRocketCI/cli/internal/config
              desc: under pkg/cmd only root.go (flags), login.go, cmdtest and tests import config; commands get portal services, scoped to the configured target, from Factory.Services
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^cmdutil\.Factory\.RestClient$
          msg: commands get portal services from Factory.Services, not Factory.RestClient (tests and cmdtest excepted)
        - pattern: ^cmdutil\.Factory\.Config$
          msg: commands get portal services, scoped to the configured target, from Factory.Services; only login.go reads Factory.Config (tests and cmdtest excepted)
        - pattern: ^cobra\.Command\.(Print|Println|Printf|OutOrStderr)$
          msg: >-
            writes through OutOrStderr, which SetOut binds to stdout (spf13/cobra#1708);
            write to f.IOStreams.ErrOut or cmd.ErrOrStderr()
        - pattern: ^lipgloss\.(F|S)?Print(f|ln)?$
          msg: >-
            the process streams built in internal/iostreams apply the colour profile and the
            terminal policy (internal/iostreams/terminal.go); write styled text with fmt
        - pattern: ^os\.Std(in|out|err)$
          pkg: ^os$
          msg: &stdstream >-
            in internal/token and internal/auth, write diagnostics to an io.Writer passed in by the caller, not to process streams
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: *stdstream
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - lll
        path: _test\.go
      # The os.Std* and print patterns apply to internal/token and internal/auth only.
      # text must match their msg.
      - linters:
          - forbidigo
        path-except: ^internal/(token|auth)/
        text: io\.Writer passed in by the caller
      # The Factory field patterns apply to commands under pkg/cmd outside cmdtest and tests;
      # login.go may read Factory.Config. text must match their msg.
      - linters:
          - forbidigo
        path-except: ^pkg/cmd/
        text: (not Factory\.RestClient|only login\.go reads Factory\.Config) \(tests and cmdtest excepted\)
      - linters:
          - forbidigo
        path: (_test\.go$|^pkg/cmd/internal/cmdtest/)
        text: (not Factory\.RestClient|only login\.go reads Factory\.Config) \(tests and cmdtest excepted\)
      - linters:
          - forbidigo
        path: ^pkg/cmd/auth/login/login\.go$
        text: only login\.go reads Factory\.Config \(tests and cmdtest excepted\)
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    goimports:
      local-prefixes:
        - github.com/KubeRocketCI/cli
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
