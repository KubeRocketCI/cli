apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: krci-cli-e2e-results
  labels:
    # A started run inherits this label; `pipelinerun get` reports it as type build.
    app.edp.epam.com/pipelinetype: build
    # Empty string is treated as "absent" by the portal's getTriggerTemplateLabel,
    # so start skips TT lookup. Required by the portal's Pipeline Zod schema.
    app.edp.epam.com/triggertemplate: ""
spec:
  description: |
    Build-typed test fixture for the krci CLI e2e suite: emits the VCS_TAG
    result of a KubeRocketCI build pipeline. Source of truth:
    source/cli/e2e/pipelinerun/fixtures/pipeline-results.yaml.
  results:
    - name: VCS_TAG
      value: $(tasks.version.results.tag)
  tasks:
    - name: version
      taskSpec:
        results:
          - name: tag
            type: string
        steps:
          - name: emit
            image: docker.io/library/busybox:1.36
            script: |
              #!/bin/sh
              printf 'build/1.0.0-SNAPSHOT.7' > $(results.tag.path)
