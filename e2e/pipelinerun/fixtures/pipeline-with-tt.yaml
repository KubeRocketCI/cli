apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: krci-cli-e2e-with-tt
  labels:
    app.edp.epam.com/pipelinetype: tests
    # References the TriggerTemplate defined in trigger-template.yaml.
    # Drives the TT branch of createPipelineRunDraftFromPipeline.
    app.edp.epam.com/triggertemplate: krci-cli-e2e-tt
spec:
  description: |
    Paired with TriggerTemplate krci-cli-e2e-tt (trigger-template.yaml). When
    started via the CLI, the portal looks up the TT, clones its
    resourcetemplate, then resolves every $(tt.params.X) placeholder using
    the param defaults declared on THIS Pipeline (not the TT's spec.params).
    Source of truth: source/cli/e2e/pipelinerun/fixtures/pipeline-with-tt.yaml.
  params:
    - name: message
      type: string
      default: "from-pipeline-default"
      description: |
        Resolved into the TT's $(tt.params.message) placeholder by Pass 1
        of createPipelineRunDraftFromPipeline. The resulting PipelineRun
        carries this value in both spec.params and a seeded label, which
        lets PR-S-TT-OK assert that the TT branch ran.
    - name: git-revision
      type: string
      default: "main"
    - name: count
      type: string
      default: "1"
    - name: should-fail
      type: string
      default: "false"
  tasks:
    - name: echo
      params:
        - name: message
          value: $(params.message)
        - name: revision
          value: $(params.git-revision)
        - name: count
          value: $(params.count)
        - name: should-fail
          value: $(params.should-fail)
      taskSpec:
        params:
          - name: message
          - name: revision
          - name: count
          - name: should-fail
        steps:
          - name: hello
            image: docker.io/library/busybox:1.36
            env:
              - name: MESSAGE
                value: $(params.message)
              - name: REVISION
                value: $(params.revision)
              - name: COUNT
                value: $(params.count)
              - name: SHOULD_FAIL
                value: $(params.should-fail)
            script: |
              #!/bin/sh
              set -eu
              i=1
              while [ "$i" -le "$COUNT" ]; do
                echo "[$i] $MESSAGE @ $REVISION (resolved via TriggerTemplate)"
                i=$((i + 1))
              done
              if [ "$SHOULD_FAIL" = "true" ]; then
                echo "SHOULD_FAIL=true -> exiting 1"
                exit 1
              fi
